services:
  app:
    build:
      context: .

    image: ${CONTAINERPULSE_IMAGE:-containerpulse:local}

    ports:
      - "${CONTAINERPULSE_PORT:-3000}:3000"

    environment:
      NODE_ENV: ${NODE_ENV:-production}

    restart: unless-stopped
    init: true

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    pids_limit: ${CONTAINERPULSE_PIDS_LIMIT:-100}
    mem_limit: ${CONTAINERPULSE_MEMORY_LIMIT:-256m}
    cpus: "${CONTAINERPULSE_CPU_LIMIT:-1.0}"

    stop_grace_period: 10s
